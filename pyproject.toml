[tool.poetry]
name = "blooper"
version = "0.1.0"
description = "A virtual garage door blooper using FastAPI to drive a HackRF One"
authors = ["Adam Smith <adam@adamsmith.as>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.78.0"
uvicorn = "^0.17.6"

[tool.poetry.dev-dependencies]
pytest = "^5.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
